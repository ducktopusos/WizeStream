name: Build WizeStream

on:
  push:
    branches: [ pipe ]
  pull_request:
    branches: [ pipe ]

  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: actions/setup-android@v3
        with:
          api-level: 37
          ndk: 28.2.13676358
          build-tools: 36.1.0

      - name: Build debug APK
        run: scripts/build.sh debug

      - name: Verify debug APK exists
        run: |
          ls -l app/build/outputs/apk/debug/app-debug.apk
