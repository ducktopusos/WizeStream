name: Build WizeStream

on:
  push:
    branches: [ pipe ]
  pull_request:
    branches: [ pipe ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.1.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -DskipFormatKtlint assembleDebug

      - name: Run thumbnail blur unit tests
        run: |
          ./gradlew --no-daemon --stacktrace -DskipFormatKtlint testDebugUnitTest \
            --tests 'org.schabi.newpipe.util.image.ThumbnailBlurTest'

      - name: Show APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="debug-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WizeStream debug build $TAG" \
            --notes "Automated debug APK built from \`$GITHUB_SHA\` on branch \`$GITHUB_REF_NAME\`." \
            app/build/outputs/apk/debug/*.apk
          echo "Release created: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
