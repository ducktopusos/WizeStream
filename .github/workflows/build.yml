name: Build WizeStream

on:
  push:
    branches: [ pipe ]
  pull_request:
    branches: [ pipe ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: ~/.android/sdk
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}

      - name: Install Android SDK
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.android/sdk/cmdline-tools
          curl -L "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d ~/.android/sdk/cmdline-tools
          # The zip may extract to either `cmdline-tools` or `cmdline-tools/tools`; handle both
          if [ -d ~/.android/sdk/cmdline-tools/tools ]; then
            mv ~/.android/sdk/cmdline-tools/tools ~/.android/sdk/cmdline-tools/latest
          else
            mv ~/.android/sdk/cmdline-tools ~/.android/sdk/cmdline-tools/latest
          fi
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;36.1.0" "ndk;28.2.13676358" "platform-tools"

      - name: Build debug APK
        run: scripts/build.sh debug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
